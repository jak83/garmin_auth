[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-auth"
version = "0.1.2"
description = "One shared way to authenticate to Garmin Connect, with optional multi-PC token sharing."
requires-python = ">=3.10"
dependencies = [
    "garminconnect>=0.3.2",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["garmin_auth*"]
